[build]
  base    = "frontend"
  # 2026-07-19 workaround preventivo del bug "Skip pristine deploys" de
  # Netlify — mismo issue documentado en `admin-frontend/netlify.toml`. En este
  # site (tecny-portal / tecnyapp.com) no se manifestó hoy porque los cambios
  # que le corresponden suelen tocar código de `frontend/src/` que sí altera
  # el `dist/` compilado. Pero un cambio SOLO en headers/CSP/redirects acá
  # (ej. un hotfix futuro donde solo se toca este `netlify.toml`) tendría el
  # mismo problema. El archivo `.build-timestamp.txt` con timestamp único
  # garantiza que Netlify siempre detecte content-change y aplique la config
  # nueva. Ver docs/NETLIFY_BUILDS.md para el detalle del bug + fix.
  command = "npm run build && date -u +%FT%TZ > dist/.build-timestamp.txt"
  publish = "dist"
  # 2026-07-30 (post link tecny-portal-staging #247): skip builds cuando el
  # commit no toca archivos que puedan afectar el output del portal.
  #
  # Watch list:
  #   · frontend/   → código del SPA
  #   · netlify.toml → headers, redirects, env vars del site (cambios acá
  #                    afectan el response HTTP, aunque el dist/ no cambie)
  #
  # Ignora: backend/, admin-frontend/, landing/, scripts/, .github/, docs/, etc.
  # Sin este ignore, cada push a main que toca esos paths dispara build →
  # Netlify cancela con "no content change" error → status rojo en la UI
  # sin impacto real (el último build válido sigue sirviendo).
  #
  # Docs: https://docs.netlify.com/configure-builds/ignore-builds/
  ignore = "git diff --quiet HEAD^ HEAD frontend/ netlify.toml"

# VITE_API_URL hardcoded acá (2026-07-04 P0). Antes vivía SOLO en Netlify UI
# → si alguien la borraba o cambiaba desde ahí, el bundle salía con el
# fallback prod duro del código (frontend/src/lib/api.js) sin que nadie se
# entere. Post-fix: la variable vive en el repo → cambio requiere commit
# visible + PR. Sin este cambio, el bug análogo al que rompió admin.tecnyapp.com
# hoy podía pasarle al portal también sin ser detectado.
#
# Contextos de Netlify:
#   [build.environment]                       → aplica a production (main)
#   [context.branch-deploy.environment]       → staging + otras branches
#   [context.deploy-preview.environment]      → PR previews
[build.environment]
  VITE_API_URL = "https://tecny-backend-production.up.railway.app"

# Service worker and PWA assets — no redirect, serve as-is
[[redirects]]
  from   = "/sw.js"
  to     = "/sw.js"
  status = 200

[[redirects]]
  from   = "/workbox-*.js"
  to     = "/workbox-:splat.js"
  status = 200

[[redirects]]
  from   = "/manifest.webmanifest"
  to     = "/manifest.webmanifest"
  status = 200

# Source maps: 404 directo, no SPA fallback. Vite genera los .map en build y
# el plugin Sentry los sube al proyecto Sentry (release tracking + stacktraces
# legibles para errors de producción), pero NO los publicamos en Netlify
# (evita que cualquiera con DevTools lea el código fuente original). Sin esta
# regla, el SPA fallback de abajo devolvería /index.html (HTML) cuando DevTools
# pide un .map, generando "JSON Parse error: Unrecognized token '<'" en la
# consola — molesto sin función rota. Con el 404 directo, DevTools recibe el
# status correcto y deja de quejarse.
[[redirects]]
  from   = "/assets/*.map"
  to     = "/404.html"
  status = 404

# SPA fallback — must come last
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers globales para todo el frontend.
#
# Este block aplica en context production. En branch-deploy y deploy-preview,
# los context-specific blocks de más abajo REPLACE este block para /* (Netlify
# NO mergea — el block context-específico reemplaza por completo al global
# para los paths que matchea). Por eso esos blocks duplican todos los headers
# (HSTS, X-Frame-Options, etc.) — la única diferencia funcional es el
# `report-uri` del CSP, que apunta al backend del env (no cross-environment).
#
# hCaptcha (signup público anti-bot, PR #281):
#   - script-src: https://*.hcaptcha.com (carga /1/api.js + onload callback)
#   - frame-src: https://*.hcaptcha.com (challenge iframe + checkbox iframe)
#   - style-src: https://*.hcaptcha.com (estilos inyectados del widget)
#   - connect-src: https://*.hcaptcha.com (siteverify telemetry + sentry.hcaptcha.com)
# Ver https://docs.hcaptcha.com/#content-security-policy-settings.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # ── Content-Security-Policy: NO va acá (task #259) ─────────────────
    # Netlify precedence: `[[headers]]` toml GANA sobre `dist/_headers`
    # cuando ambos definen el MISMO header. Confirmado empíricamente
    # 2026-07-31 (PR #955 diagnostic): un CSP toml + CSP _headers
    # producía el CSP del toml en la response, no el de _headers.
    #
    # Solución: NO definir Content-Security-Policy ni el
    # Content-Security-Policy-Report-Only acá. `frontend/scripts/
    # generate-headers.mjs` escribe `dist/_headers` con el CSP
    # restringido al backend específico del site deployed (portal-prod
    # → backend-prod solamente; portal-staging → backend-staging
    # solamente), rescatando el hardening del Fix 10 que se perdió con
    # PR #948.
    #
    # Si el generator falla, no hay CSP → browser aplica policy default
    # (equivalente a antes del hardening). NO es un P0 — es equivalent
    # al estado previo a task #259.
    #
    # Los `[[context.<X>.headers]]` de más abajo son dead code
    # (limitación Netlify: solo `[context.<X>.environment]` respeta el
    # context, no headers). Ver csp-spec.js + runbook docs/runbooks/
    # csp-landing.md sección "Build-time _headers generation".

# ── Context-specific env vars ─────────────────────────────────────────
#
# `[context.<X>.environment]` DOES respect deploy context (VITE_API_URL
# varies per site). Los `[[context.<X>.headers]]` NO — task #259 confirmed
# empíricamente que son dead code. Se removieron los blocks headers
# context-específicos porque metían ruido en el toml sin efecto runtime.
# Los security headers son iguales en todos los contexts (vienen del
# [[headers]] global de arriba); el CSP context-específico lo maneja
# `dist/_headers` generado por `frontend/scripts/generate-headers.mjs`
# a partir de VITE_API_URL del context deployed.

# 2026-07-30: `[context.staging]` explícito porque en el site
# tecny-portal-staging el primary branch ES `staging`, entonces
# `[context.branch-deploy.environment]` NO le aplica — sin este block
# quedaría con el VITE_API_URL de `[build.environment]` (prod), rompiendo
# el propósito de staging.
[context.staging.environment]
  VITE_API_URL = "https://tecny-backend-staging.up.railway.app"

[context.branch-deploy.environment]
  VITE_API_URL = "https://tecny-backend-staging.up.railway.app"

# Deploy previews (PR builds) también contra staging backend — mismo
# criterio (entornos no-prod, no ensucian data prod).
[context.deploy-preview.environment]
  VITE_API_URL = "https://tecny-backend-staging.up.railway.app"

# Headers for service worker scope and caching
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
