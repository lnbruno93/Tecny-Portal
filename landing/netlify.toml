# Netlify config para el site landing de tecnyapp.com (Astro SSG).
#
# Contexto: migración desde SPA React (frontend/) a sitio estático para
# poder correr Meta ADS con Pixel + CAPI limpio. Ver docs de migración.
#
# CONVIVENCIA CON EL SITE PORTAL:
#   Este site (tecny-landing) servirá `tecnyapp.com/`, `/precios`, `/faq`,
#   `/legal/*` y todo lo que sea landing marketing.
#
#   El site tecny-portal (frontend/) sigue existiendo y se accede vía proxy
#   rewrite desde acá — rutas de app (/login, /signup, /inicio, /ventas...)
#   se rewritean status=200 al portal site. El browser nunca ve dos dominios.
#
#   Los proxy rewrites concretos están al final de este file (Fase 6).
#
# CONVENCIÓN de contexts (misma que root netlify.toml):
#   [build.environment]                    → production
#   [context.branch-deploy.environment]    → staging + otras branches
#   [context.deploy-preview.environment]   → PR previews

[build]
  base    = "landing"
  # Sin dist/.build-timestamp.txt workaround — Astro genera hash-based
  # filenames que cambian por content, así que no aplica el bug "Skip
  # pristine deploys" que sufre el SPA. Si en el futuro se ve el patrón,
  # replicar como en root netlify.toml.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_API_URL: leída por src/lib/api.ts al build (import.meta.env.
  # PUBLIC_API_URL) para armar fetches del CMS backend. Env por contexto.
  PUBLIC_API_URL = "https://tecny-backend-production.up.railway.app"
  # PUBLIC_META_PIXEL_ID (F4, 2026-07-29): ID del Meta Pixel de Lucas.
  # Consumido por src/components/MetaPixel.astro. Es PÚBLICO por design
  # de Meta (cualquiera lo lee en el HTML) — safe commitear en el TOML.
  # Si Lucas rota el pixel, cambiar acá + rebuild.
  PUBLIC_META_PIXEL_ID = "2418492122007058"
  # PUBLIC_GA4_MEASUREMENT_ID (F4, 2026-07-29): Google Analytics 4.
  # También PÚBLICO por design (aparece en el <script> gtag). Cambio =
  # rebuild. Property GA4 de Lucas: G-GVJR5D9VSP.
  PUBLIC_GA4_MEASUREMENT_ID = "G-GVJR5D9VSP"

[context.branch-deploy.environment]
  PUBLIC_API_URL = "https://tecny-backend-staging.up.railway.app"
  # Staging comparte el mismo Pixel + GA4 prod. Si a futuro querés
  # separación (evitar mezclar traffic sintético con real), agregar
  # IDs staging acá. Meta y GA4 ambos permiten multi-property.
  PUBLIC_META_PIXEL_ID = "2418492122007058"
  PUBLIC_GA4_MEASUREMENT_ID = "G-GVJR5D9VSP"

[context.deploy-preview.environment]
  PUBLIC_API_URL = "https://tecny-backend-staging.up.railway.app"
  PUBLIC_META_PIXEL_ID = "2418492122007058"
  PUBLIC_GA4_MEASUREMENT_ID = "G-GVJR5D9VSP"

# Headers globales.
#
# CSP (F4): permite Meta Pixel (script + img + connect a facebook.net/.com)
# y Google Fonts (style-src, font-src). NO Google Analytics todavía —
# se agrega cuando Lucas comparta measurement ID (F4b).
#
# script-src 'unsafe-inline' temporal (F4 MVP): el snippet oficial de Meta
# es inline con IIFE — no bundleable sin modificar. F4b HARDENING: calcular
# SHA256 del snippet exacto y reemplazar 'unsafe-inline' por 'sha256-XXX='.
# Tech debt tracked, no bloquea F4.
#
# frame-ancestors 'none' + X-Frame-Options DENY: protección clickjacking
# doble (defense in depth — mismo pattern que root netlify.toml).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # 2026-07-30 P0 fix: agregado `https://*.hcaptcha.com` a script-src,
    # style-src, frame-src y connect-src. Root cause: cuando el catch-all
    # proxy sirve /login (y /signup, /forgot-password) desde tecny-portal,
    # el CSP que aplica es el DE ESTE header block (headers del landing,
    # no del portal — Netlify pattern). El CSP anterior no permitía el
    # widget hCaptcha invisible que corre en esas 3 pantallas → widget no
    # cargaba → no generaba token → backend rechazaba con "Verificación
    # inválida" y el user quedaba bloqueado sin poder loguearse.
    # Los directives agregados replican los del netlify.toml del portal
    # (línea equivalente en frontend/netlify.toml).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hcaptcha.com; img-src 'self' data: https://www.facebook.com https://*.facebook.com https://www.google-analytics.com https://*.google-analytics.com https://tecny-backend-production.up.railway.app https://tecny-backend-staging.up.railway.app; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://tecny-backend-production.up.railway.app https://tecny-backend-staging.up.railway.app https://www.facebook.com https://*.facebook.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://*.hcaptcha.com; frame-src 'self' https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Static assets cacheados agresivamente — Astro genera hash-based filenames
# para JS/CSS/imgs procesados, safe para immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap generado por @astrojs/sitemap — importante para SEO.
[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"

# ═══════════════════════════════════════════════════════════════════════════
# PROXY REWRITES a tecny-portal (F6 cutover DNS).
# ═══════════════════════════════════════════════════════════════════════════
#
# Modelo: DENYLIST implícito con catch-all + `force = false` (default).
# Netlify prioriza static files del build SOBRE los redirects → si el path
# existe en `dist/` (index.html, _astro/*, robots.txt, sitemap-*, favicon,
# og-cover.png), se sirve directo. Todo lo demás cae al catch-all abajo
# y se proxea al site tecny-portal.
#
# EJEMPLOS de resolución:
#   /                          → dist/index.html (landing, estático)
#   /_astro/index.abc.css      → dist/_astro/index.abc.css (estático)
#   /robots.txt                → dist/robots.txt (estático)
#   /og-cover.png              → dist/og-cover.png (estático)
#   /login                     → NO existe en dist/ → proxy a tecny-portal
#   /signup                    → NO existe → proxy
#   /inicio, /ventas, /cajas   → NO existen → proxy (SPA routes)
#   /publico/usados/:token     → NO existe → proxy (public share links)
#
# COOKIES/AUTH:
#   Cuando DNS de tecnyapp.com apunte a este site, el browser ve tecnyapp.com
#   uniformemente — cookies auth (accessToken, refreshToken) se setean con
#   Domain=tecnyapp.com y se envían en TODAS las requests, incluyendo las
#   proxeadas a /login o /inicio. tecny-portal ya sirve el SPA con esas
#   cookies presentes. Cero CORS, cero re-login.
#
# ASSETS DEL SPA:
#   El SPA de tecny-portal referencia `/assets/*.js` (path relativo). Cuando
#   el browser pide tecnyapp.com/assets/xxx.js, ese path tampoco existe en
#   `dist/` de landing → cae al catch-all → proxy al portal → sirve el JS
#   real. Todo transparente.
#
# API BACKEND:
#   Los fetches de la landing y del SPA usan URL absoluta a Railway
#   (https://tecny-backend-production.up.railway.app/api/...). NO pasan
#   por este proxy — van directo. Cero overhead.
#
# ORDEN CRÍTICO: el catch-all `/*` debe ir ÚLTIMO. Netlify aplica la primera
# regla que matchea; un `/*` arriba consumiría todo (incluyendo assets del
# build, rompiendo la landing).

# Rutas históricas conocidas del portal — enumeradas explícitamente para
# audit trail. NO son necesarias funcionalmente (el catch-all abajo las
# captura), pero dejan constancia de QUÉ paths asumimos que el portal
# maneja. Si alguna aparece en Sentry con 404, actualizar acá.
#
# Comentado por ahora — solo el catch-all activo. Descomentar si necesitamos
# rewrites custom (ej. redirect permanente de /precios-viejos → /precios).
#
# [[redirects]]
#   from   = "/login"
#   to     = "https://tecny-portal.netlify.app/login"
#   status = 200

# CATCH-ALL: todo path no matcheado por static files ni redirects anteriores
# se proxea al site tecny-portal. `force = false` (default) preserva la
# prioridad de static files del build.
[[redirects]]
  from   = "/*"
  to     = "https://tecny-portal.netlify.app/:splat"
  status = 200
  force  = false
